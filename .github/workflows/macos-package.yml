name: macOS Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'osx/**'
      - '*.xml'
      - '.github/workflows/macos-package.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # verify builds the app without invoking the upstream installer target,
      # which requires Developer ID certificates and Sparkle signing keys.
      - name: Build app and run unit tests
        run: >-
          mvn --batch-mode --no-transfer-progress verify
          --also-make --projects i18n,profiles,osx
          -DskipITs -Drevision=0 -Pno-testcontainers
        env:
          SKIP_SIGN: 'true'
          SKIP_NOTARIZE: 'true'
          SPARKLE_FEED: ''
      - name: Apply ad hoc signatures
        shell: bash
        run: |
          app=osx/target/Cyberduck.app
          # Native libraries are modified during bundling. Sign them again so
          # macOS can load them on Apple Silicon without a Developer ID.
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              codesign --force --sign - "$binary"
            fi
          done < <(find "$app" -type f -print0)
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
      - name: Package macOS installer
        shell: bash
        run: |
          app=osx/target/Cyberduck.app
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          archive="Cyberduck-${version}-${GITHUB_SHA:0:8}"
          mkdir -p osx/target/release
          productbuild --component "$app" /Applications "osx/target/release/$archive.pkg"
          ditto -c -k --sequesterRsrc --keepParent "$app" "osx/target/release/$archive.zip"
          cd osx/target/release
          shasum -a 256 "$archive.pkg" "$archive.zip" > SHA256SUMS.txt
      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: Cyberduck-macOS-${{ github.sha }}
          path: |
            osx/target/release/*.pkg
            osx/target/release/*.zip
            osx/target/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
